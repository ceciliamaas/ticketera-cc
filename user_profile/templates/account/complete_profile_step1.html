{% extends "./base.html" %}
{% load static %}
{% block innercontent %}
    <div class="row justify-content-center">
        <div class="col-xl-7">
            <div class="main-card d-flex justify-content-between flex-column align-items-center main-card-spacing gap-3">
                <h1>Completa tu perfil</h1>
                <form method="post" id="profile-form">
                    {% csrf_token %}
                    <div class="form-group d-flex flex-column w-100 gap-3">
                        {% if form.non_field_errors %}
                            <div class="alert alert-danger" role="alert">
                                {% for error in form.non_field_errors %}{{ error }}{% endfor %}
                            </div>
                        {% endif %}
                        <!-- First Name -->
                        <label for="first_name">
                            <div class="mb-1">Nombre/s</div>
                            <input type="text"
                                   class="form-control"
                                   id="first_name"
                                   name="first_name"
                                   placeholder="Ingresa tu nombre"
                                   value="{{ form.first_name.value|default_if_none:'' }}">
                            {% if form.first_name.errors %}
                                <div class="text-danger">
                                    {% for error in form.first_name.errors %}{{ error }}{% endfor %}
                                </div>
                            {% endif %}
                        </label>
                        <button type="submit" id="submit-button" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('profile-form').addEventListener('submit', function () {
            var submitButton = document.getElementById('submit-button');
            submitButton.disabled = true;
            submitButton.innerHTML = 'Cargando...';
        });
    </script>
{% endblock %}
